<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="NBG 3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E36414">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#E36414">
<title>NBG 3 Abschluss</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23E36414'/><text x='50' y='63' font-size='40' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>N3</text></svg>">
<style>
  :root{
    --orange:#E36414;
    --dark:#1c1c1c;
    --grey:#6b6b6b;
    --line:#e4e4e4;
    --bg:#f7f6f4;
    --card:#ffffff;
    --green:#1D9E75;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--dark);
    overscroll-behavior-y:contain;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:20px 16px 100px;
  }
  header{
    padding-top: env(safe-area-inset-top, 0px);
  }
  h1{
    font-size:26px;
    font-weight:700;
    margin:14px 0 2px;
    letter-spacing:-0.5px;
  }
  .sub{
    color:var(--grey);
    font-size:14px;
    margin:0 0 14px;
  }
  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .progress-track{
    flex:1;
    height:8px;
    background:#e9e7e2;
    border-radius:4px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--orange);
    border-radius:4px;
    transition:width .25s ease;
  }
  .progress-label{
    font-size:13px;
    font-weight:600;
    color:var(--grey);
    min-width:44px;
    text-align:right;
  }
  .section-title{
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
    color:var(--orange);
    text-transform:uppercase;
    margin:22px 2px 8px;
  }
  .card{
    background:var(--card);
    border-radius:14px;
    border:1px solid var(--line);
    overflow:hidden;
  }
  .item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 14px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    user-select:none;
  }
  .item:last-child{border-bottom:none;}
  .box{
    width:24px;
    height:24px;
    border-radius:7px;
    border:2px solid #c9c7c1;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s, border-color .15s;
  }
  .box svg{
    width:14px;
    height:14px;
    opacity:0;
    transition:opacity .12s;
  }
  .item.checked .box{
    background:var(--green);
    border-color:var(--green);
  }
  .item.checked .box svg{opacity:1;}
  .item span{
    font-size:16px;
    line-height:1.35;
    transition:color .15s, opacity .15s;
  }
  .item.checked span{
    color:var(--grey);
    text-decoration:line-through;
    opacity:.65;
  }
  .footer-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    padding:12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
  }
  .reset-btn{
    max-width:480px;
    margin:0 auto;
    display:block;
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--grey);
    font-size:15px;
    font-weight:600;
  }
  .reset-btn:active{background:#f0efeb;}
  .done-banner{
    margin-top:16px;
    padding:14px;
    border-radius:12px;
    background:#e6f5ef;
    color:#0f6e56;
    font-size:15px;
    font-weight:600;
    text-align:center;
    display:none;
  }
  .done-banner.show{display:block;}
</style>
<style>
  #offlineBadge{
    position:fixed;
    top:calc(8px + env(safe-area-inset-top, 0px));
    right:10px;
    z-index:20;
    padding:5px 9px;
    border-radius:999px;
    background:#1c1c1c;
    color:white;
    font-size:11px;
    font-weight:700;
    opacity:.85;
    display:none;
  }
</style>

<style id="nbg3-pin-css">
  #pinScreen{
    position:fixed; inset:0; z-index:9999;
    display:flex; align-items:center; justify-content:center;
    padding:24px; background:var(--bg);
  }
  #pinCard{
    width:100%; max-width:360px; background:var(--card);
    border:1px solid var(--line); border-radius:18px;
    padding:26px 20px 22px; text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.08);
  }
  #pinCard h2{margin:0 0 6px;font-size:24px}
  #pinCard p{margin:0 0 18px;color:var(--grey);font-size:14px}
  #pinInput{
    width:100%;padding:14px;border:1px solid var(--line);
    border-radius:12px;font-size:22px;text-align:center;
    letter-spacing:8px;outline:none;background:#fff;
  }
  #pinInput:focus{border-color:var(--orange)}
  #pinButton{
    width:100%;margin-top:12px;padding:14px;border:0;
    border-radius:12px;background:var(--orange);color:#fff;
    font-size:16px;font-weight:700;
  }
  #pinError{min-height:20px;margin-top:10px;color:#c0392b;font-size:13px;font-weight:600}
  .brand-footer{text-align:center;color:#9a9892;font-size:11px;margin-top:18px;padding-bottom:4px}
  .lock-btn{
    max-width:480px;margin:0 auto 8px;display:block;width:100%;
    padding:14px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--grey);font-size:15px;font-weight:600;
  }
  .lock-btn:active{background:#f0efeb}
</style>

<style id="report-photo-css">
  .item-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
  .item-content{flex:1;min-width:0}
  .photo-actions{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap}
  .photo-btn{
    border:1px solid var(--line);background:#fff;color:var(--grey);
    border-radius:9px;padding:6px 9px;font-size:12px;font-weight:700;
  }
  .photo-btn.required{border-color:var(--orange);color:var(--orange)}
  .photo-preview{
    width:58px;height:58px;object-fit:cover;border-radius:9px;
    border:1px solid var(--line);display:none;margin-top:7px;
  }
  .photo-status{font-size:11px;color:var(--grey);margin-left:2px}
  .report-btn{
    max-width:480px;margin:0 auto 8px;display:block;width:100%;
    padding:14px;border-radius:12px;border:0;
    background:var(--orange);color:#fff;font-size:15px;font-weight:700;
    opacity:.45;
  }
  .report-btn.ready{opacity:1}
  .report-hint{
    max-width:480px;margin:0 auto 8px;text-align:center;
    font-size:12px;color:var(--grey);
  }
  .report-result{
    display:none;margin:12px 0;padding:12px;border-radius:12px;
    background:#e6f5ef;color:#0f6e56;font-size:13px;font-weight:600;text-align:center;
  }
</style>
</head>
<body><div id="offlineBadge">Offline</div>
<input id="photoInput" type="file" accept="image/*" capture="environment" style="display:none">
<div id="pinScreen">
  <div id="pinCard">
    <h2>NBG 3</h2>
    <p>Bitte PIN eingeben</p>
    <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*"
           maxlength="4" autocomplete="off" aria-label="PIN">
    <button id="pinButton">Entsperren</button>
    <div id="pinError"></div>
    <div class="brand-footer">designed by Dignity.</div>
  </div>
</div>

<div class="wrap">
  <header>
    <h1>NBG 3 Abschluss</h1>
    <p class="sub">Checkliste zum Schichtende</p>
  </header>

  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="fill"></div></div>
    <div class="progress-label" id="label">0/14</div>
  </div>

  <div id="sections"></div>

  <div class="done-banner" id="doneBanner">Alles erledigt. Guten Feierabend!</div>
  <div class="brand-footer">designed by Dignity.</div>
</div>

<div class="footer-bar">
  
<div class="report-hint" id="reportHint">Alle Punkte abhaken. Für „Alarm scharfschalten“ ist ein Foto Pflicht.</div>
<button class="report-btn" id="reportBtn">✅ Abschluss erstellen & teilen</button>
<div class="report-result" id="reportResult"></div>

    <button class="lock-btn" id="lockBtn">🔒 App sperren</button>
    <button class="reset-btn" id="resetBtn">Zurücksetzen</button>
</div>

<script>
const DATA = [
  { title: "Tiefkühlung & Kühlung", items: [
    "TK Licht aus",
    "TK Tor zu",
    "Kühlung Licht aus",
    "Kühlung Tor zu"
  ]},
  { title: "Ladegeräte", items: [
    "Stapler laden, wenn nötig",
    "Ameise laden, wenn nötig",
    "Deichsel laden, wenn nötig",
    "Schnellläufer laden, wenn nötig"
  ]},
  { title: "Betriebsschluss", items: [
    "Büro abgesperrt",
    "Boden saubermachen",
    "Licht aus",
    "Haupttür zusperren",
    { label: "Alarm scharfschalten", photoRequired: true },
    "Außentore schließen"
  ]}
];

const STORAGE_KEY = "nbg3_checklist_state";
const TOTAL = DATA.reduce((n, s) => n + s.items.length, 0);

function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return {};
    const parsed = JSON.parse(raw);
    if(parsed.day !== todayKey()) return {};
    return parsed.checked || {};
  }catch(e){ return {}; }
}

function saveState(checked){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ day: todayKey(), checked }));
  }catch(e){}
}

let checked = loadState();
let photos = {};
let currentPhotoId = null;

const sectionsEl = document.getElementById("sections");
const fillEl = document.getElementById("fill");
const labelEl = document.getElementById("label");
const doneBanner = document.getElementById("doneBanner");


function openPhotoPicker(id){
  currentPhotoId = id;
  const input = document.getElementById("photoInput");
  input.value = "";
  input.click();
}

document.getElementById("photoInput").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if(!file || !currentPhotoId) return;
  const reader = new FileReader();
  reader.onload = () => {
    photos[currentPhotoId] = reader.result;
    render();
  };
  reader.readAsDataURL(file);
});

function getItemInfo(){
  const list = [];
  DATA.forEach((section, sIdx) => {
    section.items.forEach((raw, iIdx) => {
      const item = typeof raw === "string" ? {label: raw, photoRequired:false} : raw;
      list.push({section: section.title, label: item.label, id: sIdx + "-" + iIdx, photoRequired: !!item.photoRequired});
    });
  });
  return list;
}

function reportReady(){
  const items = getItemInfo();
  return items.every(item => checked[item.id]) &&
         items.filter(item => item.photoRequired).every(item => !!photos[item.id]);
}

function updateReportButton(){
  const btn = document.getElementById("reportBtn");
  const hint = document.getElementById("reportHint");
  if(!btn) return;
  const ready = reportReady();
  btn.classList.toggle("ready", ready);
  btn.disabled = !ready;
  hint.textContent = ready
    ? "Alles vollständig. Der Abschluss kann geteilt werden."
    : "Alle Punkte abhaken. Für „Alarm scharfschalten“ ist ein Foto Pflicht.";
}

async function createAndShareReport(){
  if(!reportReady()) return;

  const now = new Date();
  const date = now.toLocaleDateString("de-DE");
  const time = now.toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"});
  const items = getItemInfo();

  let text = "NBG 3 – Schichtabschluss\n";
  text += date + " · " + time + " Uhr\n\n";

  let lastSection = "";
  items.forEach(item => {
    if(item.section !== lastSection){
      text += item.section + "\n";
      lastSection = item.section;
    }
    text += "✅ " + item.label + (photos[item.id] ? " 📷" : "") + "\n";
  });

  text += "\nAbschluss: vollständig\n";
  text += "designed by Dignity.";

  const files = [];
  let photoNumber = 1;
  for(const item of items){
    if(!photos[item.id]) continue;
    const res = await fetch(photos[item.id]);
    const blob = await res.blob();
    const safe = item.label.replace(/[^a-z0-9äöüß]+/gi, "_").replace(/^_|_$/g,"");
    files.push(new File([blob], `NBG3_${photoNumber}_${safe || "Foto"}.jpg`, {type: blob.type || "image/jpeg"}));
    photoNumber++;
  }

  try{
    if(navigator.share && files.length && navigator.canShare && navigator.canShare({files})){
      await navigator.share({title:"NBG 3 Schichtabschluss", text, files});
    }else if(navigator.share){
      await navigator.share({title:"NBG 3 Schichtabschluss", text});
    }else{
      await navigator.clipboard.writeText(text);
      alert("Der Report wurde kopiert. Du kannst ihn jetzt in WhatsApp oder Mail einfügen.");
    }
    const result = document.getElementById("reportResult");
    result.textContent = "Report erstellt. Du kannst ihn über den Teilen-Dialog verschicken.";
    result.style.display = "block";
  }catch(e){
    if(e && e.name !== "AbortError") {
      const result = document.getElementById("reportResult");
      result.textContent = "Teilen wurde abgebrochen oder ist auf diesem Gerät nicht verfügbar.";
      result.style.display = "block";
    }
  }
}

document.getElementById("reportBtn").addEventListener("click", createAndShareReport);

function render(){
  sectionsEl.innerHTML = "";
  DATA.forEach((section, sIdx) => {
    const h = document.createElement("div");
    h.className = "section-title";
    h.textContent = section.title;
    sectionsEl.appendChild(h);

    const card = document.createElement("div");
    card.className = "card";

    section.items.forEach((label, iIdx) => {
      const id = sIdx + "-" + iIdx;
      const itemData = typeof label === "string" ? { label, photoRequired: false } : label;
      const row = document.createElement("div");
      row.className = "item" + (checked[id] ? " checked" : "");

      const hasPhoto = !!photos[id];
      const requiredText = itemData.photoRequired ? ' <span class="photo-status">Foto erforderlich</span>' : '';
      row.innerHTML =
        '<div class="box"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"></polyline></svg></div>' +
        '<div class="item-content"><span>' + itemData.label + '</span>' +
        '<div class="photo-actions">' +
        '<button type="button" class="photo-btn' + (itemData.photoRequired ? ' required' : '') + '" data-photo="' + id + '">📷 ' + (hasPhoto ? 'Foto ändern' : 'Foto hinzufügen') + '</button>' +
        requiredText +
        '</div>' +
        '<img class="photo-preview" src="' + (hasPhoto ? photos[id] : '') + '" alt="Foto">' +
        '</div>';

      row.querySelector("[data-photo]").addEventListener("click", e => {
        e.stopPropagation();
        openPhotoPicker(id);
      });
      row.addEventListener("click", e => {
        if (e.target.closest(".photo-actions")) return;
        toggle(id);
      });
      const preview = row.querySelector(".photo-preview");
      if (hasPhoto) preview.style.display = "block";
      card.appendChild(row);
    });
    sectionsEl.appendChild(card);
  });
  updateProgress();
}

function toggle(id){
  checked[id] = !checked[id];
  if(!checked[id]) delete checked[id];
  saveState(checked);
  render();
  if(navigator.vibrate) navigator.vibrate(8);
}

function updateProgress(){
  const done = Object.keys(checked).length;
  const pct = Math.round((done / TOTAL) * 100);
  fillEl.style.width = pct + "%";
  labelEl.textContent = done + "/" + TOTAL;
  doneBanner.classList.toggle("show", done === TOTAL);
  updateReportButton();
}

document.getElementById("resetBtn").addEventListener("click", () => {
  checked = {};
  photos = {};
  saveState(checked);
  render();
});

render();
</script>
<script>
  // PWA: cache the app so it can continue working offline.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
  function updateOnlineState(){
    const badge = document.getElementById("offlineBadge");
    if (badge) badge.style.display = navigator.onLine ? "none" : "block";
  }
  window.addEventListener("online", updateOnlineState);
  window.addEventListener("offline", updateOnlineState);
  updateOnlineState();
</script>

<script id="nbg3-pin-js">
(function(){
  const APP_PIN = "2026";
  const UNLOCK_SESSION = "nbg3_session_unlocked_v2";

  const screen = document.getElementById("pinScreen");
  const input = document.getElementById("pinInput");
  const button = document.getElementById("pinButton");
  const error = document.getElementById("pinError");
  const lock = document.getElementById("lockBtn");

  function showPin(){
    screen.style.display = "flex";
    input.value = "";
    error.textContent = "";
    setTimeout(() => input.focus(), 100);
  }

  function unlock(){
    if(input.value === APP_PIN){
      sessionStorage.setItem(UNLOCK_SESSION, "1");
      screen.style.display = "none";
      input.value = "";
      error.textContent = "";
    }else{
      error.textContent = "Falscher PIN.";
      input.value = "";
      input.focus();
    }
  }

  button.addEventListener("click", unlock);
  input.addEventListener("keydown", e => {
    if(e.key === "Enter") unlock();
  });

  lock.addEventListener("click", () => {
    sessionStorage.removeItem(UNLOCK_SESSION);
    showPin();
  });

  if(sessionStorage.getItem(UNLOCK_SESSION) === "1"){
    screen.style.display = "none";
  }else{
    showPin();
  }
})();
</script>
</body>
</html>
