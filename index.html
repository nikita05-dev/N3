<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="NBG 3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E36414">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#E36414">
<title>NBG 3 Abschluss</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23E36414'/><text x='50' y='63' font-size='40' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>N3</text></svg>">
<style>
  :root{
    --orange:#E36414;
    --dark:#1c1c1c;
    --grey:#6b6b6b;
    --line:#e4e4e4;
    --bg:#f7f6f4;
    --card:#ffffff;
    --green:#1D9E75;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--dark);
    overscroll-behavior-y:contain;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:20px 16px 100px;
  }
  header{
    padding-top: env(safe-area-inset-top, 0px);
  }
  h1{
    font-size:26px;
    font-weight:700;
    margin:14px 0 2px;
    letter-spacing:-0.5px;
  }
  .sub{
    color:var(--grey);
    font-size:14px;
    margin:0 0 14px;
  }
  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .progress-track{
    flex:1;
    height:8px;
    background:#e9e7e2;
    border-radius:4px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--orange);
    border-radius:4px;
    transition:width .25s ease;
  }
  .progress-label{
    font-size:13px;
    font-weight:600;
    color:var(--grey);
    min-width:44px;
    text-align:right;
  }
  .section-title{
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
    color:var(--orange);
    text-transform:uppercase;
    margin:22px 2px 8px;
  }
  .card{
    background:var(--card);
    border-radius:14px;
    border:1px solid var(--line);
    overflow:hidden;
  }
  .item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 14px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    user-select:none;
  }
  .item:last-child{border-bottom:none;}
  .box{
    width:24px;
    height:24px;
    border-radius:7px;
    border:2px solid #c9c7c1;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s, border-color .15s;
  }
  .box svg{
    width:14px;
    height:14px;
    opacity:0;
    transition:opacity .12s;
  }
  .item.checked .box{
    background:var(--green);
    border-color:var(--green);
  }
  .item.checked .box svg{opacity:1;}
  .item span{
    font-size:16px;
    line-height:1.35;
    transition:color .15s, opacity .15s;
  }
  .item.checked span{
    color:var(--grey);
    text-decoration:line-through;
    opacity:.65;
  }
  .footer-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    padding:12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
  }
  .reset-btn{
    max-width:480px;
    margin:0 auto;
    display:block;
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--grey);
    font-size:15px;
    font-weight:600;
  }
  .reset-btn:active{background:#f0efeb;}
  .lock-btn{
    max-width:480px;
    margin:0 auto 8px;
    display:block;
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--grey);
    font-size:15px;
    font-weight:600;
  }
  .lock-btn:active{background:#f0efeb;}
  .done-banner{
    margin-top:16px;
    padding:14px;
    border-radius:12px;
    background:#e6f5ef;
    color:#0f6e56;
    font-size:15px;
    font-weight:600;
    text-align:center;
    display:none;
  }
  .done-banner.show{display:block;}
</style>
<style>
  #offlineBadge{
    position:fixed;
    top:calc(8px + env(safe-area-inset-top, 0px));
    right:10px;
    z-index:20;
    padding:5px 9px;
    border-radius:999px;
    background:#1c1c1c;
    color:white;
    font-size:11px;
    font-weight:700;
    opacity:.85;
    display:none;
  }
</style>

<style>
  #pinScreen{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:var(--bg);
  }
  #pinCard{
    width:100%;
    max-width:360px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 20px 22px;
    text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.08);
  }
  #pinCard h2{
    margin:0 0 6px;
    font-size:24px;
  }
  #pinCard p{
    margin:0 0 18px;
    color:var(--grey);
    font-size:14px;
  }
  #pinInput{
    width:100%;
    padding:14px;
    border:1px solid var(--line);
    border-radius:12px;
    font-size:22px;
    text-align:center;
    letter-spacing:8px;
    outline:none;
    background:#fff;
  }
  #pinInput:focus{border-color:var(--orange);}
  #pinButton{
    width:100%;
    margin-top:12px;
    padding:14px;
    border:0;
    border-radius:12px;
    background:var(--orange);
    color:#fff;
    font-size:16px;
    font-weight:700;
  }
  #pinError{
    min-height:20px;
    margin-top:10px;
    color:#c0392b;
    font-size:13px;
    font-weight:600;
  }
  .brand-footer{
    text-align:center;
    color:#9a9892;
    font-size:11px;
    margin-top:18px;
    padding-bottom:4px;
    letter-spacing:.2px;
  }
</style>
</head>
<body><div id="offlineBadge">Offline</div>
<div id="pinScreen">
  <div id="pinCard">
    <h2>NBG 3</h2>
    <p>Bitte PIN eingeben</p>
    <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*"
           maxlength="6" autocomplete="off" aria-label="PIN">
    <button id="pinButton">Entsperren</button>
    <div id="pinError"></div>
    <div class="brand-footer">designed by Dignity.</div>
  </div>
</div>

<div class="wrap">
  <header>
    <h1>NBG 3 Abschluss</h1>
    <p class="sub">Checkliste zum Schichtende</p>
  </header>

  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="fill"></div></div>
    <div class="progress-label" id="label">0/14</div>
  </div>

  <div id="sections"></div>

  <div class="done-banner" id="doneBanner">Alles erledigt. Guten Feierabend!</div>
  <div class="brand-footer">designed by Dignity.</div>
</div>

<div class="footer-bar">
  <button class="lock-btn" id="lockBtn">🔒 App sperren</button>
    <button class="reset-btn" id="resetBtn">Zurücksetzen</button>
</div>

<script>
const DATA = [
  { title: "Tiefkühlung & Kühlung", items: [
    "TK Licht aus",
    "TK Tor zu",
    "Kühlung Licht aus",
    "Kühlung Tor zu"
  ]},
  { title: "Ladegeräte", items: [
    "Stapler laden, wenn nötig",
    "Ameise laden, wenn nötig",
    "Deichsel laden, wenn nötig",
    "Schnellläufer laden, wenn nötig"
  ]},
  { title: "Betriebsschluss", items: [
    "Büro abgesperrt",
    "Boden saubermachen",
    "Licht aus",
    "Haupttür zusperren",
    "Alarm scharfschalten",
    "Außentore schließen"
  ]}
];

const STORAGE_KEY = "nbg3_checklist_state";
const TOTAL = DATA.reduce((n, s) => n + s.items.length, 0);

function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return {};
    const parsed = JSON.parse(raw);
    if(parsed.day !== todayKey()) return {};
    return parsed.checked || {};
  }catch(e){ return {}; }
}

function saveState(checked){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ day: todayKey(), checked }));
  }catch(e){}
}

let checked = loadState();

const sectionsEl = document.getElementById("sections");
const fillEl = document.getElementById("fill");
const labelEl = document.getElementById("label");
const doneBanner = document.getElementById("doneBanner");

function render(){
  sectionsEl.innerHTML = "";
  DATA.forEach((section, sIdx) => {
    const h = document.createElement("div");
    h.className = "section-title";
    h.textContent = section.title;
    sectionsEl.appendChild(h);

    const card = document.createElement("div");
    card.className = "card";

    section.items.forEach((label, iIdx) => {
      const id = sIdx + "-" + iIdx;
      const row = document.createElement("div");
      row.className = "item" + (checked[id] ? " checked" : "");
      row.innerHTML =
        '<div class="box"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"></polyline></svg></div>' +
        "<span>" + label + "</span>";
      row.addEventListener("click", () => toggle(id));
      card.appendChild(row);
    });
    sectionsEl.appendChild(card);
  });
  updateProgress();
}

function toggle(id){
  checked[id] = !checked[id];
  if(!checked[id]) delete checked[id];
  saveState(checked);
  render();
  if(navigator.vibrate) navigator.vibrate(8);
}

function updateProgress(){
  const done = Object.keys(checked).length;
  const pct = Math.round((done / TOTAL) * 100);
  fillEl.style.width = pct + "%";
  labelEl.textContent = done + "/" + TOTAL;
  doneBanner.classList.toggle("show", done === TOTAL);
}

document.getElementById("resetBtn").addEventListener("click", () => {
  checked = {};
  saveState(checked);
  render();
});

render();
</script>
<script>
  // PWA: cache the app so it can continue working offline.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
  function updateOnlineState(){
    const badge = document.getElementById("offlineBadge");
    if (badge) badge.style.display = navigator.onLine ? "none" : "block";
  }
  window.addEventListener("online", updateOnlineState);
  window.addEventListener("offline", updateOnlineState);
  updateOnlineState();
</script>

<script>
  // Simple local PIN gate for the PWA.
  // Change the PIN here if you want a different one.
  const APP_PIN = "2026";
  const PIN_UNLOCKED_KEY = "nbg3_pin_unlocked";

  const pinScreen = document.getElementById("pinScreen");
  const pinInput = document.getElementById("pinInput");
  const pinButton = document.getElementById("pinButton");
  const pinError = document.getElementById("pinError");

  function unlockApp(){
    if (pinInput.value === APP_PIN) {
      localStorage.setItem(PIN_UNLOCKED_KEY, "1");
      pinScreen.style.display = "none";
      pinInput.value = "";
      pinError.textContent = "";
    } else {
      pinError.textContent = "Falscher PIN.";
      pinInput.value = "";
      pinInput.focus();
    }
  }

  function initPin(){
    if (localStorage.getItem(PIN_UNLOCKED_KEY) === "1") {
      pinScreen.style.display = "none";
    } else {
      pinScreen.style.display = "flex";
      setTimeout(() => pinInput.focus(), 100);
    }
  }


  document.getElementById("lockBtn").addEventListener("click", () => {
    localStorage.removeItem(PIN_UNLOCKED_KEY);
    pinScreen.style.display = "flex";
    pinInput.value = "";
    pinError.textContent = "";
    setTimeout(() => pinInput.focus(), 100);
  });

  pinButton.addEventListener("click", unlockApp);
  pinInput.addEventListener("keydown", e => {
    if (e.key === "Enter") unlockApp();
  });
  initPin();
</script>
</body>
</html>
